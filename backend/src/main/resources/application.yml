server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: ai-photo-editor

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_photo_editor?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  security:
    jwt-secret: ${JWT_SIGNING_SECRET:}
    issuer: ${JWT_ISSUER:ai-photo-editor}
    access-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}

  google:
    enabled: ${GOOGLE_AUTH_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}